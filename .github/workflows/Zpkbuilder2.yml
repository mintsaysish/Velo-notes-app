name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Archive
        run: unzip -o VeloNoteStudio_Android_Repo.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: '' # Explicitly tells setup-android v4 NOT to run sdkmanager and fail

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper not found in root, searching..."
            find . -name "gradlew" -exec chmod +x {} \;
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            # Fallback if gradlew is nested inside the unzipped folder
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            $GRADLEW_PATH assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloNoteStudio-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
